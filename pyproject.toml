[project]
name = "onebot"
version = "2.0.0"
description = "OneBot is an irc bot based on irc3"
authors = [{ name = "Thom Wiggers", email = "thom@thomwiggers.nl" }]
readme = "README.rst"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["onebot", "irc"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat :: Internet Relay Chat",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "irc3>=1.1.12",
  "lfmh>=1.1.1",
  "musicbrainzngs>=0.7.1",
  "beautifulsoup4>=4.15.0",
  "requests>=2.34.2",
  "isodate>=0.7.2",
  "cryptography>=49.0.0",
  "tekore>=6.2.0",
  "dateparser>=1.4.1",
  "redis>=8.0.1",
  "praw>=8.0.2",
]

[project.urls]
Repository = "https://github.com/thomwiggers/onebot"

[project.scripts]
onebot = "onebot:run"

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "pytest",
  "ruff",
  "betamax",
  "coverage",
  "pytest-cov",
  "tox",
  "tox-uv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onebot"]

[tool.tox]
legacy_tox_ini = """
[tox]
requires =
    tox-uv
envlist = py311,py312,py313,py314,package

[testenv]
package = editable
dependency_groups =
    dev
commands =
    pytest

[testenv:package]
skip_install = True
commands =
    uv build
"""

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--doctest-modules --ignore=docs/"

[tool.ruff]
line-length = 88
target-version = "py311"
