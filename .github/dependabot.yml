version: 2

# One monthly PR for all version updates, across ecosystems. The develop
# ruleset requires PRs to be up to date, so separate PRs would leave each other
# behind after every merge, and Dependabot does not rebase those promptly.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly

updates:
- package-ecosystem: github-actions
  directory: "/"
  patterns:
    - "*"
  multi-ecosystem-group: dependencies
  groups:
    actions-security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: uv
  directory: "/"
  patterns:
    - "*"
  multi-ecosystem-group: dependencies
  groups:
    python-security:
      applies-to: security-updates
      patterns:
        - "*"
