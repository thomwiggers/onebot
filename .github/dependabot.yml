version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
        - "*"
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: monthly
  groups:
    python-packages:
      applies-to: version-updates
      patterns:
        - "*"
    python-security:
      applies-to: security-updates
      patterns:
        - "*"
