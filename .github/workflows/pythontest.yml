name: Test

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.x"]

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --all-groups
    - name: Run pytest
      run: |
        uv run pytest --cov=onebot
        uv run coverage lcov
    - name: Run ruff formatting
      run: |
        uv run ruff format --check .
    - name: Run ruff check
      run: |
        uv run ruff check .
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: run-${{ matrix.python-version }}
        parallel: true
        path-to-lcov: coverage.lcov
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  # Merge Dependabot PRs once the jobs above have passed. This job is skipped
  # when any of them fails, so a broken update stays open for a human.
  automerge:
    name: Merge Dependabot PR
    needs: [test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Squash-merge
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      # Merges made with GITHUB_TOKEN do not trigger push workflows, so start
      # the publish run by hand.
      - name: Start publish run on develop
        run: |
          gh workflow run docker-publish.yml --ref develop
          gh workflow run python-sandbox-publish.yml --ref develop
